name: Llama-3-Tunnel-Master
on: [workflow_dispatch]

jobs:
  llama-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 ติดตั้ง Ollama และเจาะท่อ
        run: |
          # ติดตั้ง Ollama แบบติดเทอร์โบ
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve & 
          sleep 10
          ollama run llama3 "Hello Master Bye" & # ปลุก Llama 3
          
          # เจาะท่อด้วย Bore (แจกพิกัดหน้าจอแชท)
          curl -Ls https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -zxf -
          ./bore local 11434 --to bore.pub
