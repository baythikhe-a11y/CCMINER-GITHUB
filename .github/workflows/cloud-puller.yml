name: Master-Bye-Local-Deployer
on: [workflow_dispatch]

jobs:
  local-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ บีบอัดโค้ดติดตั้ง "น้องจิ๋ว" ให้ Master Bye
        run: |
          # สร้างสคริปต์ติดตั้งอัตโนมัติในเครื่อง Master Bye
          echo "pkg update && pkg upgrade -y" > deploy-mini.sh
          echo "pkg install python wget -y" >> deploy-mini.sh
          echo "pip install llama-cpp-python" >> deploy-mini.sh
          echo "wget https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf -O mini-brain.gguf" >> deploy-mini.sh
          echo "python -c 'from llama_cpp import Llama; llm = Llama(model_path=\"./mini-brain.gguf\"); print(\"🤖 น้องจิ๋วรันในเครื่อง Master Bye แล้วครับ!\")' " >> deploy-mini.sh
          
          # ส่งสคริปต์นี้ขึ้นฟ้าเพื่อเตรียมส่งลงมา
          curl --upload-file ./deploy-mini.sh https://transfer.sh/deploy-mini-master-bye.sh > deploy_link.txt
          echo "📡 [DEPLOY-LINK] คำสั่งติดตั้งลงเครื่องพี่: curl -L $(cat deploy_link.txt) | bash"
